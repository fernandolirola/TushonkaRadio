<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tushonka Radio</title><link rel="stylesheet" href="styles.css"><script defer src="core.js"></script><script defer src="app.js"></script></head><body><div id="shell">
<section id="panel" hidden><header><div><span class="brand">ZEZINHO'S</span><h1>Tushonka Radio</h1></div><button id="language" class="quiet">EN / PT</button></header><nav aria-label="Music source"><button id="youtubeTab" class="selected">YouTube</button><button id="localTab" data-i18n="local">Local music</button></nav>
<div id="youtubeSection"><div class="section-title"><h2 data-i18n="playlists">Playlists</h2><span id="context" class="muted">MENU</span></div><div id="playlists" class="scroll-list short"></div><details id="addDetails"><summary data-i18n="add">Add playlist or video</summary><form id="playlistForm"><label for="playlistUrl" data-i18n="link">Link</label><input id="playlistUrl" type="url" required maxlength="512" placeholder="https://www.youtube.com/playlist?list=..."><label for="playlistName" data-i18n="name">Custom Name (optional)</label><input id="playlistName" maxlength="80" autocomplete="off"><button type="submit" data-i18n="save">Save</button></form></details></div>
<div class="section-title"><h2 id="tracksTitle" data-i18n="tracks">Tracks</h2><button id="refresh" class="quiet" data-i18n="refresh">Refresh</button></div><div id="tracks" class="scroll-list"></div><p id="musicPath" class="hint" hidden data-i18n="path">Add files to HideoutRadio/Player/Music.</p><label id="previewPick" class="hint" hidden>Browser preview files<input type="file" id="previewFiles" accept="audio/*" multiple></label>
<div id="status" role="status" aria-live="polite"></div></section>
<section id="mini" aria-label="Music player"><span id="moveGrip" class="grip" title="Drag to move" aria-hidden="true">&#8942;</span><button id="artButton" class="art-button" aria-label="Open library"><span id="artFallback" aria-hidden="true">&#9835;</span><img id="cover" alt="" hidden></button><button id="trackInfo" class="track-info" aria-label="Open library"><span id="songTitle">Tushonka Radio</span><span id="artist" data-i18n="choose">Choose a playlist</span></button><div class="controls"><button id="shuffle" aria-pressed="false" data-i18n="shuffle">Shuffle</button><button id="repeat" aria-pressed="true" data-i18n="repeat">Repeat</button><button id="previous" aria-label="Previous track">&#9664;&#9664;</button><button id="play" class="play" aria-label="Play">&#9654;</button><button id="next" aria-label="Next track">&#9654;&#9654;</button></div><button id="expand" aria-label="Show library" aria-expanded="false">&#8963;</button><button id="close" class="close" aria-label="Close player">&#10005;</button><div class="mini-volume"><label for="volume" data-i18n="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="35"><output id="volumeValue">35%</output></div><span id="resizeGrip" class="grip" title="Drag to resize" aria-hidden="true">&#8945;</span><div class="progress"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Track position"></div></section><audio id="audio" preload="metadata"></audio></div></body></html>
