<!doctype html><html><head><meta charset="utf-8"><title>Radio lifecycle check</title><style>body{background:#151515;color:#eee;font:14px sans-serif}button{padding:10px;margin:4px}iframe{display:block;width:620px;height:780px;border:1px solid #555}</style></head><body><h1>Radio lifecycle check</h1><button id="raid">Enter raid</button><button id="menu">Return to menu</button><button id="hideout">Enter hideout</button><button id="noresume">Return without resume</button><iframe id="player" src="index.html"></iframe><script>let epoch=0;function runtime(mode,resume=true){document.getElementById('player').contentWindow.radio.receive({type:'runtime',mode,epoch:++epoch,visible:mode!=='blocked',resume,language:'en'});}document.getElementById('raid').onclick=()=>runtime('blocked');document.getElementById('menu').onclick=()=>runtime('menu');document.getElementById('hideout').onclick=()=>runtime('hideout');document.getElementById('noresume').onclick=()=>runtime('menu',false);</script></body></html>
